[project]
name = "ai-eng"
version = "0.1.0"
description = "Learning AI engineering, from fundamentals to frontier, one notebook at a time"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "dspy>=3.4.1",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "instructor>=1.17.0",
    "ipykernel",
    "jinja2>=3.1.6",
    "lightgbm>=4.7.0",
    "litellm>=1.105.1",
    "matplotlib",
    "mlx>=0.32.4",
    "mlx-lm>=0.32.0",
    "numpy",
    "openai",
    "pandas",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pypdf>=6.20.1",
    "python-dotenv",
    "scikit-learn>=1.9.1",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.19.0",
    "umap-learn>=0.5.12",
    "xgboost>=3.4.1",
]
# Lessons add their own deps with `uv add <pkg>` as you reach them.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aieng"]
