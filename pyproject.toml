[project]
name = "ai-eng"
version = "0.1.0"
description = "Learning AI engineering, from fundamentals to frontier, one notebook at a time"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "anthropic>=1.14.0",
    "arize-phoenix>=14.6.0",
    "bm25s>=0.3.13",
    "chromadb>=1.5.9",
    "datasets>=5.1.0",
    "diffusers>=0.41.0",
    "docling>=2.139.0",
    "dspy>=3.4.1",
    "en-core-web-sm",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.143.2",
    "google-genai>=2.31.0",
    "gradio>=6.30.0",
    "graphql-core<3.3", # arize-phoenix (strawberry) breaks on 3.3
    "haystack-ai>=3.4.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "instructor>=1.17.0",
    "ipykernel",
    "ipywidgets>=8.1.9",
    "jinja2>=3.1.6",
    "jiwer>=4.0.0",
    "kokoro>=0.9.4",
    "lancedb>=0.40.0",
    "langchain>=1.4.6",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.0.1",
    "langgraph>=1.2.15",
    "lightgbm>=4.7.0",
    "litellm>=1.105.1",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-llms-openai-like>=0.8.1",
    "lm-eval>=0.4.13",
    "markitdown[docx,pdf]>=0.1.8",
    "matplotlib",
    "mcp>=2.3.0",
    "mlx>=0.32.4",
    "mlx-lm>=0.32.0",
    "mlx-vlm>=0.7.8",
    "mlx-whisper>=0.4.3",
    "networkx>=3.7",
    "numpy",
    "openai",
    "openai-agents>=0.20.0",
    "openinference-instrumentation-openai>=0.1.65",
    "pandas",
    "peft>=0.21.2",
    "playwright>=1.64.0",
    "polars>=2.0.0",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pydantic-ai-slim>=2.56.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.20.1",
    "python-dotenv",
    "qdrant-client>=1.19.1",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "smolagents>=1.26.0",
    "soundfile>=0.14.0",
    "sqlite-vec>=0.1.9",
    "streamlit>=1.66.0",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.19.0",
    "trl<1.15", # 1.15 trainers need a Triton (Linux-only) fused LM head: breaks on macOS
    "umap-learn>=0.5.12",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]
# Lessons add their own deps with `uv add <pkg>` as you reach them.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aieng"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
